<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .matrix-grid {
            display: grid;
            gap: 2px;
            width: 100%;
            height: 100%;
            place-items: center;
        }
        .matrix-grid-H {
            grid-template-columns: repeat(32, minmax(0, 1fr));
            grid-template-rows: repeat(12, minmax(0, 1fr));
        }
        .matrix-grid-V {
            grid-template-rows: repeat(32, minmax(0, 1fr));
            grid-template-columns: repeat(12, minmax(0, 1fr));
        }

        .month-label,
        .circle-btn {
            box-sizing: border-box;
            width: calc(100% - 6px);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            font-family: inherit;
            font-size: inherit;
        }

        .month-label {
            border: 1px solid transparent;
            user-select: none;
        }

        .circle-btn {
            border-radius: 50%;
            user-select: none;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        .circle-btn:active {
            transform: scale(0.88);
        }

        /* Distinct Color States */
        .state-0 {
            background-color: #334155; /* Slate/Gray Base */
            color: #94a3b8;
        }
        .state-0:hover {
            background-color: #475569;
            color: #f1f5f9;
        }

        .state-1 {
            background-color: #0284c7; /* Vibrant Cyan/Sky Blue */
            color: #ffffff;
            box-shadow: 0 0 6px rgba(2, 132, 199, 0.6);
            border-color: #38bdf8;
        }
        .state-1:hover {
            background-color: #0369a1;
        }

        .state-2 {
            background-color: #d97706; /* Warm Amber/Orange */
            color: #ffffff;
            box-shadow: 0 0 6px rgba(217, 119, 6, 0.6);
            border-color: #fbbf24;
        }
        .state-2:hover {
            background-color: #b45309;
        }

        .state-3 {
            background-color: #059669; /* Vivid Emerald Green */
            color: #ffffff;
            box-shadow: 0 0 6px rgba(5, 150, 105, 0.6);
            border-color: #34d399;
        }
        .state-3:hover {
            background-color: #047857;
        }

        .date-range1 {
            border-color: #b90000;
        }

        .date-range2 {
            background-color: #202835;
            color: #8f8f8f;
            border-color: #000000;
        }

        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background: #1a1912;
            border: 2px solid #3f5bda;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .hiddenPanel {
            display: none;
        }

        .config-text {
            background-color: #202835;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 flex flex-col font-sans select-none">

    <!-- Top Header & Dashboard -->
    <header class="flex-none bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <h1 id="year" class="text-xs sm:text-sm font-bold text-slate-200 tracking-wide">2000</h1>
        </div>

        <!-- State Counter Stats -->
        <div class="flex items-center gap-2 sm:gap-4 bg-slate-950 px-3 py-1 rounded-lg border border-slate-800 text-[11px] font-mono">
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-600 inline-block"></span>
                <span class="text-slate-400 hidden sm:inline">Days:</span>
                <span id="count0" class="font-bold text-slate-300">0</span>
            </div>
            <div class="h-3 w-[1px] bg-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span>
                <span id="statAction1" class="text-slate-400 hidden sm:inline">X:</span>
                <span id="count1" class="font-bold text-sky-400">0</span>
            </div>
            <div class="h-3 w-[1px] bg-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
                <span id="statAction2" class="text-slate-400 hidden sm:inline">Y:</span>
                <span id="count2" class="font-bold text-amber-400">0</span>
            </div>
            <div class="h-3 w-[1px] bg-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                <span id="statAction3" class="text-slate-400 hidden sm:inline">Z:</span>
                <span id="count3" class="font-bold text-emerald-400">0</span>
            </div>
        </div>

        <!-- Global Control Buttons -->
        <div class="flex items-center gap-2">
            <button id="btn-flip" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                Flip
            </button>
            <button id="btn-config" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                Configure
            </button>
            <button id="btn-reset" class="px-2.5 py-1 text-xs font-semibold rounded bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 border border-rose-800/60 transition">
                Reset
            </button>
        </div>
    </header>

    <!-- Center Viewport Area (Strict Single-Page Fit) -->
    <main class="flex-1 w-full h-full min-h-0 min-w-0 p-2 sm:p-4 flex flex-col items-center justify-center overflow-hidden">
        <div class="w-full h-full max-w-full max-h-full bg-slate-900/80 rounded-xl border border-slate-800 p-2 flex flex-col overflow-hidden shadow-2xl">
            <div id="matrix" class="matrix-grid min-h-0 min-w-0"></div>
        </div>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="flex-none bg-slate-950 border-t border-slate-800/80 px-4 py-1 text-[11px] text-slate-400 flex justify-between items-center">
        <span id="input-help">Click any button to cycle state</span>
        <span id="last-click" class="font-mono text-slate-500">Ready</span>
    </footer>

    <div id="configPanel" class="panel hiddenPanel">
        <div class="grid grid-cols-[auto_1fr] items-center gap-x-4 gap-y-4">
           <label for="configAction1" class="text-sm font-medium">Blue</label>
           <input type="text" id="configAction1" class="config-text w-full">

           <label for="configAction2" class="text-sm font-medium">Amber</label>
           <input type="text" id="configAction2" class="config-text w-full">

           <label for="configAction3" class="text-sm font-medium">Green</label>
           <input type="text" id="configAction3" class="config-text w-full">
        </div>

        <div class="mt-4 flex justify-end">
            <button id="configSave">Save</button>
        </div>
    </div>

    <!-- Single File Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const MONTHS = 12;
            const MAXDAYS = 31;

            const matrixContainer = document.getElementById('matrix');
            const inputHelpLabel = document.getElementById('input-help');
            const lastChangeLabel = document.getElementById('last-click');

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const currentYear = today.getFullYear();
            const monthNames = ['J','F','M','A','M','J','J','A','S','O','N','D'];
            year.textContent = currentYear;

            // Persistent configuration state
            function readActions() {
                try {
                    const rawData = localStorage.getItem('configActions');
                    if (rawData === null) {
                        return null;
                    }

                    const parsed = JSON.parse(rawData);
                    if (!Array.isArray(parsed)) {
                        return null;
                    }

                    return parsed;
                } catch (error) {
                    console.error(`Error reading actions:`, error);
                    return null;
                }
            }
            function storeActions() {
                localStorage.setItem('configActions', JSON.stringify(actions));
            }
            const actions = readActions() ?? ['Blue', 'Amber', 'Green'];
            let isVertical = false;

            // Color states by day index, defaults to zero past end
            // Keep synced to local storage
            function readStates() {
                try {
                    const rawData = localStorage.getItem(`year${currentYear}`);
                    if (rawData === null) {
                        return [];
                    }

                    const parsed = JSON.parse(rawData);
                    if (!Array.isArray(parsed)) {
                        return [];
                    }

                    return parsed.map(item => Number(item));
                } catch (error) {
                    console.error(`Error reading state:`, error);
                    return [];
                }
            }
            function storeStates() {
                localStorage.setItem(`year${currentYear}`, JSON.stringify(states));
            }
            const states = readStates();

            function getState(index) {
                if (index < states.length) {
                    return states[index];
                }
                return 0;
            }

            function setState(index, value) {
                if (value === 0 && index >= states.length) {
                    return;
                }
                while (index >= states.length) {
                    states.push(0);
                }
                states[index] = value;
                updateButtonState(index);
                statesChanged();
            }

            function statesChanged() {
                updateStats();
                storeStates();
            }

            // Buttons by day index, mathing states
            const buttonElts = [];
            // matrix elements as 32x12 horizontal array
            const matrixElts = [];

            // Generate buttons and matrix elements
            for (let month = 0; month < MONTHS; month++) {
                const label = document.createElement('span');
                label.textContent = monthNames[month];
                label.className = `month-label text-xs font-bold`;
                matrixElts.push(label);

                const daysInMonth = new Date(currentYear, month + 1, 0).getDate();
                for (let c = 0; c < MAXDAYS; c++) {
                    const colNum = c + 1;

                    if (c >= daysInMonth) {
                        const div = document.createElement('div');
                        matrixElts.push(div);
                    } else {
                        const index = buttonElts.length;
                        const date = new Date(currentYear, month, c + 1)
                        date.setHours(0, 0, 0, 0);
                        const dateString = date.toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                        let dateMode = 1;  // today
                        if (date < today) {
                            dateMode = 0;  // past
                        } else if (date > today) {
                            dateMode = 2;  // future
                        }

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.textContent = colNum;
                        if (dateMode === 2) {
                            btn.style.pointerEvents = 'none';
                        }
                        
                        // Click handler to cycle through states
                        btn.addEventListener('click', () => {
                            if (dateMode === 2) return;

                            const newValue = (getState(index) + 1) % 4;
                            setState(index, newValue);
                            const result = newValue === 0 ? 'unset' : actions[newValue - 1];
                            lastChangeLabel.textContent = `${dateString} is now ${result}`;
                        });
                        
                        btn.addEventListener('mouseenter', () => {
                            if (dateMode === 2) return;
                            inputHelpLabel.textContent = `Click to change ${dateString} state`;
                        });
                        btn.addEventListener('mouseleave', () => {
                            inputHelpLabel.textContent = ``;
                        });
                        
                        matrixElts.push(btn);
                        const info = {
                            button: btn,
                            mode: dateMode,
                        };
                        buttonElts.push(info);
                        updateButtonState(buttonElts.length - 1);
                    }
                }
            }

            // Place elements into matrix based on orientation
            function populateMatrix() {
                matrixContainer.className = 'matrix-grid min-h-0 min-w-0';
                if (isVertical) {
                    matrixContainer.classList.add('matrix-grid-V');
                    matrixContainer.replaceChildren();
                    let offset = 0;
                    for (let i = 0; i < matrixElts.length; i++) {
                        const mod12 = i % 12;
                        matrixContainer.appendChild(matrixElts[mod12 * 32 + offset]);
                        if (mod12 === 11) offset++;
                    }
                } else {
                    matrixContainer.classList.add('matrix-grid-H');
                    matrixContainer.replaceChildren();
                    for (const elt of matrixElts) {
                        matrixContainer.appendChild(elt);
                    }
                }
            }

            // Helper to sync CSS classes for a given button index
            function updateButtonState(idx) {
                const info = buttonElts[idx];
                const state = getState(idx);
                const mode = info.mode === 0 ? '' : ` date-range${info.mode}`;
                info.button.className = `circle-btn state-${state}${mode} text-[10px] sm:text-xs font-mono font-semibold max-w-full max-h-full`;
            }

            // Update state counts display
            function updateStats() {
                let active = false, n = 0;
                let count = [0, 0, 0], run = [0, 0, 0], max = [0, 0, 0];
                for (let i = 0; i < buttonElts.length; i++) {
                    if (buttonElts[i].mode === 2) break;
                    const st = getState(i) - 1;
                    if (st !== -1) active = true;
                    if (active) {
                        n++;
                        if (st >= 0) {
                            count[st]++;
                            const last = run[st];
                            run = [0, 0, 0];
                            run[st] = last + 1;
                            if (run[st] > max[st]) max[st] = run[st];
                        }
                    }
                }
                function summary() {
                    if (n === 0) return '--';
                    const sum = count[0] + count[1] + count[2];
                    return `${sum}/${n}`;
                }
                function readout(i) {
                    if (n === 0) return '--';
                    const frac = (count[i] * 100) / n;
                    const percent = Math.round(frac);
                    return `${percent}% (${max[i]})`;
                }
                statAction1.textContent = `${actions[0]}:`;
                statAction2.textContent = `${actions[1]}:`;
                statAction3.textContent = `${actions[2]}:`;
                count0.textContent = summary();
                count1.textContent = readout(0);
                count2.textContent = readout(1);
                count3.textContent = readout(2);
            }

            // Controls
            function helpString(id, stringF) {
                document.getElementById(id).addEventListener('mouseenter', () => {
                    inputHelpLabel.textContent = stringF();
                });
                document.getElementById(id).addEventListener('mouseleave', () => {
                    inputHelpLabel.textContent = ``;
                });
            }

            document.getElementById('btn-flip').addEventListener('click', () => {
                isVertical = !isVertical;
                populateMatrix();
            });
            helpString('btn-flip', () => {
                 return 'Flip orientation between horizontal and vertical.'; 
            })

            document.getElementById('btn-reset').addEventListener('click', () => {
                const confirm = window.confirm('Reset all days to an unset state?');
                if (confirm) {
                    states.length = 0;
                    for (let i = 0; i < buttonElts.length; i++) updateButtonState(i);
                    statesChanged();
                    lastChangeLabel.textContent = `All days of the year are now unset.`;
                }
            });
            helpString('btn-reset', () => {
                return `Click to reset all days to unset.`;
            });

            document.getElementById('btn-config').addEventListener('click', () => {
                if (configPanel.classList.contains('hiddenPanel')) {
                    configAction1.value = actions[0];
                    configAction2.value = actions[1];
                    configAction3.value = actions[2];
                    configPanel.classList.remove('hiddenPanel');
                } else {
                    configPanel.classList.add('hiddenPanel');
                }
            });
            helpString('btn-config', () => {
                if (configPanel.classList.contains('hiddenPanel')) {
                    return `Click to configure the goal names.`;
                }
                return `Click to close configuration panel without saving.`;
            });

            configSave.addEventListener('click', () => {
                configPanel.classList.add('hiddenPanel');
                actions[0] = configAction1.value;
                actions[1] = configAction2.value;
                actions[2] = configAction3.value;
                lastChangeLabel.textContent = `Goal names changed to ${actions[0]}, ${actions[1]}, and ${actions[2]}.`;
                storeActions();
                updateStats();
            });

            // Initial setup
            populateMatrix();
            updateStats();
        });
    </script>
</body>
</html>
